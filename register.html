<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrieren - Feather Lifesteal</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .login-container {
            width: min(100%, 460px);
            margin: 40px auto;
            padding: 35px;

            background: #111821;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header h1 {
            margin-top: 8px;
            font-size: 32px;
        }

        .login-header p {
            margin-top: 10px;
            color: #9aa6b2;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            height: 46px;

            padding: 0 14px;

            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9px;

            outline: none;

            background: #0d1219;
            color: white;

            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #55d66b;
        }

        .form-hint {
            margin-top: 6px;

            color: #66717d;
            font-size: 12px;
        }

        .login-button {
            width: 100%;
            margin-top: 8px;
        }

        .form-message {
            display: none;

            margin: 15px 0;
            padding: 12px;

            border-radius: 9px;

            background: rgba(85, 214, 107, 0.08);
            border: 1px solid rgba(85, 214, 107, 0.2);

            color: #55d66b;

            font-size: 13px;
        }

        .form-message.show {
            display: block;
        }

        .login-footer {
            margin-top: 25px;

            text-align: center;

            color: #9aa6b2;
            font-size: 13px;
        }

        .login-footer a {
            display: inline-block;
            margin-top: 7px;

            color: #55d66b;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="site-header">

        <div>

            <a href="index.html" class="logo">
                FEATHER <span>LIFESTEAL</span>
            </a>

            <a href="index.html" class="login-link">
                ← Zurück zur Website
            </a>

        </div>

    </header>


    <!-- REGISTER -->

    <main>

        <section class="section">

            <div class="login-container">

                <div class="login-header">

                    <span class="section-label">
                        ACCOUNT
                    </span>

                    <h1>
                        Account erstellen
                    </h1>

                    <p>
                        Erstelle deinen Feather Lifesteal Account.
                    </p>

                </div>


                <form id="registerForm">

                    <div class="form-group">

                        <label for="username">
                            Benutzername
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Dein Benutzername"
                            minlength="3"
                            maxlength="20"
                            required
                            autocomplete="username"
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            E-Mail-Adresse
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="deine@email.de"
                            required
                            autocomplete="email"
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Passwort
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Mindestens 8 Zeichen"
                            minlength="8"
                            required
                            autocomplete="new-password"
                        >

                        <div class="form-hint">
                            Verwende mindestens 8 Zeichen.
                        </div>

                    </div>


                    <div class="form-group">

                        <label for="passwordConfirm">
                            Passwort wiederholen
                        </label>

                        <input
                            type="password"
                            id="passwordConfirm"
                            name="passwordConfirm"
                            placeholder="Passwort wiederholen"
                            minlength="8"
                            required
                            autocomplete="new-password"
                        >

                    </div>


                    <div
                        id="registerMessage"
                        class="form-message"
                        aria-live="polite"
                    ></div>


                    <button
                        type="submit"
                        class="button login-button"
                    >
                        Account erstellen
                    </button>

                </form>


                <div class="login-footer">

                    <p>
                        Du hast bereits einen Account?
                    </p>

                    <a href="login.html">
                        Zum Login
                    </a>

                </div>

            </div>

        </section>

    </main>


    <script>

        const registerForm =
            document.getElementById("registerForm");

        const registerMessage =
            document.getElementById("registerMessage");


        registerForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const passwordConfirm =
                document.getElementById("passwordConfirm").value;


            if (password !== passwordConfirm) {

                registerMessage.textContent =
                    "Die Passwörter stimmen nicht überein.";

                registerMessage.classList.add("show");

                return;
            }


            registerMessage.textContent =
                "Registrierung wird noch mit der Datenbank verbunden.";

            registerMessage.classList.add("show");

        });

    </script>

</body>

</html>
